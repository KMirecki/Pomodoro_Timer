<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-theme="pomodoro">
    <header>
      <p id="clock" aria-live="off"></p>
    </header>

    <main>
      <section class="btn-group" aria-label="Timer modes">
        <button type="button" class="btn" data-mode="pomodoro">Pomodoro</button>
        <button type="button" class="btn" data-mode="shortBreak">
          Short Break
        </button>
        <button type="button" class="btn" data-mode="longBreak">
          Long Break
        </button>
      </section>

      <time id="pomodoroClock" aria-live="polite">25:00</time>

      <section class="btn-group" aria-label="Timer controls">
        <button type="button" class="btn" id="start">Start</button>
        <button type="button" class="btn" id="stop">Stop</button>
        <button type="button" class="btn" id="reset">Reset</button>
      </section>
    </main>

    <script src="index.js"></script>
  </body>
</html>
